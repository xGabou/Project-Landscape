plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.42'
    id 'org.spongepowered.mixin' version '0.7.38'
}

group = maven_group
version = mod_version
base { archivesName = "${mod_id}-forge-${minecraft_version}" }
java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

// Development-only smoke harness. Never packaged in the production mod jar.
sourceSets {
    performance {
        java.srcDir 'src/reproduction/java'
        java.include 'baseline/reproduction/performance/**'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    reproduction {
        java.exclude 'baseline/reproduction/performance/**'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    smoke {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { reterraforged { source sourceSets.main } }
        }
        client { }
        reproductionClient {
            parent runs.client
            workingDirectory project.file('run/task1a')
            mods { task1a_reproduction { source sourceSets.reproduction } }
            jvmArgs '-Xmx6G'
            if (providers.gradleProperty('reproProcessors').isPresent()) {
                jvmArgs "-XX:ActiveProcessorCount=${providers.gradleProperty('reproProcessors').get()}"
            }
            property 'task1a.profile', providers.gradleProperty('reproProfile').getOrElse('full')
            property 'task1a.seeds', providers.gradleProperty('reproSeeds').getOrElse('8675309,4303642605,42,-987654321')
            property 'task1a.repeats', providers.gradleProperty('reproRepeats').getOrElse('3')
            property 'task1a.points', providers.gradleProperty('reproPoints').getOrElse('')
            // Task 1C test corpus only; no production generation-version mechanism.
            property 'task1c.fixtureFile', file('docs/task1c/evidence/fixture_manifest.json').absolutePath
            if (providers.gradleProperty('reproPreset').isPresent()) {
                property 'task1a.presetFile', file(providers.gradleProperty('reproPreset').get()).absolutePath
            }
            args '--mixin.config', 'task1a-observers.mixins.json'
        }
        smokeClient {
            parent runs.client
            workingDirectory project.file('run/task0-smoke')
            mods { baseline_smoke { source sourceSets.smoke } }
            property 'mixin.debug.export', 'true'
            property 'task1b.smokeVanilla', providers.gradleProperty('smokeVanilla').getOrElse('false')
            property 'task4.smokeV1', providers.gradleProperty('smokeV1').getOrElse('false')
            if (providers.gradleProperty('smokeExistingWorld').isPresent()) {
                property 'task2.existingWorld', providers.gradleProperty('smokeExistingWorld').get()
            }
            jvmArgs '-Xmx6G'
        }
        server { args '--nogui' }
        data {
            workingDirectory project.file('run/data')
            if (providers.gradleProperty('task6bOutput').isPresent()) {
                workingDirectory project.file('run/task6b-offline')
                mods { task6b_performance { source sourceSets.performance } }
                property 'task6b.output', file(providers.gradleProperty('task6bOutput').get()).absolutePath
                property 'task6b.mode', providers.gradleProperty('task6bMode').getOrElse('acquisition')
                property 'task6b.sourceChecks', providers.gradleProperty('task6bSourceChecks').getOrElse('false')
                jvmArgs '-Xmx6G', "-XX:ActiveProcessorCount=${providers.gradleProperty('task6bWorkers').getOrElse('8')}"
            }
            args '--mod', providers.gradleProperty('task6bOutput').isPresent() ? 'task6b_performance' : mod_id, '--all', '--output', file(providers.gradleProperty('task6bOutput').isPresent() ? 'build/task6b-datagen-unused' : 'src/generated/resources/'),
                 '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, 'reterraforged-refmap.json'
    config 'reterraforged-common.mixins.json'
    config 'reterraforged-forge.mixins.json'
}
sourceSets.main.resources.srcDir 'src/generated/resources'

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly fg.deobf("curse.maven:terrablender-563928:${terrablender_curse_file}")
    if (providers.gradleProperty('withTerraBlender').get().toBoolean()) {
        runtimeOnly fg.deobf("curse.maven:terrablender-563928:${terrablender_curse_file}")
    }
    if (providers.gradleProperty('withDevelopmentMods').get().toBoolean()) {
        runtimeOnly fg.deobf('curse.maven:project-atmosphere-1258344:8799655')
        runtimeOnly fg.deobf('curse.maven:gabous-libs-1367332:8774253')
        runtimeOnly fg.deobf('curse.maven:glitchcore-955399:5787839')
        runtimeOnly fg.deobf('curse.maven:serene-seasons-291874:8246702')
        runtimeOnly fg.deobf('curse.maven:simple-clouds-1121215:6928978')
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.named('jar', Jar) {
    from('LICENSE') { into 'META-INF' }
    manifest {
        attributes 'MixinConfigs': 'reterraforged-common.mixins.json,reterraforged-forge.mixins.json'
    }
    finalizedBy 'reobfJar'
}
tasks.named('sourcesJar', Jar) { from('LICENSE') { into 'META-INF' } }

// Offline production macro provider survey; no Minecraft client, chunks or terrain erosion.
tasks.register('task6bCacheChecks', JavaExec) {
    dependsOn tasks.named('performanceClasses')
    classpath = sourceSets.performance.runtimeClasspath
    mainClass = 'baseline.reproduction.performance.ExactCacheChecks'
    args file(providers.gradleProperty('task6bOutput').getOrElse('build/task6b-cache-checks')).absolutePath
}

tasks.register('task6bJfrSummary', JavaExec) {
    dependsOn tasks.named('performanceClasses')
    classpath = sourceSets.performance.runtimeClasspath
    mainClass = 'baseline.reproduction.performance.ProfileSummary'
    args providers.gradleProperty('task6bJfr').getOrElse(''), providers.gradleProperty('task6bSummary').getOrElse('')
}

tasks.register('task4Survey', JavaExec) {
    dependsOn tasks.named('reproductionClasses')
    classpath = sourceSets.reproduction.runtimeClasspath
    mainClass = 'baseline.reproduction.geography.GeographySurvey'
    maxHeapSize = '2G'
    args file(providers.gradleProperty('task4Output').getOrElse('build/task4-survey')).absolutePath
}

// Offline Task 5 climate fixtures and V1 distribution survey.
tasks.register('task5ClimateSurvey', JavaExec) {
    dependsOn tasks.named('reproductionClasses')
    classpath = sourceSets.reproduction.runtimeClasspath
    mainClass = 'baseline.reproduction.climate.ClimateSurvey'
    maxHeapSize = '2G'
    args file(providers.gradleProperty('task5Output').getOrElse('build/task5-climate-survey')).absolutePath
}
tasks.register('task5bClimateAudit', JavaExec) {
    dependsOn tasks.named('reproductionClasses')
    classpath = sourceSets.reproduction.runtimeClasspath
    mainClass = 'baseline.reproduction.climate.ClimateCalibrationAudit'
    maxHeapSize = '2G'
    args file(providers.gradleProperty('task5bOutput').getOrElse('build/task5b-climate-audit')).absolutePath
}
tasks.register('task6BiomeSurvey', JavaExec) {
    dependsOn tasks.named('reproductionClasses')
    classpath = sourceSets.reproduction.runtimeClasspath
    mainClass = 'baseline.reproduction.biome.BiomeSurvey'
    systemProperty 'task6.checksOnly', providers.gradleProperty('task6ChecksOnly').getOrElse('false')
    maxHeapSize = '2G'
    args file(providers.gradleProperty('task6Output').getOrElse('build/task6-biome-survey')).absolutePath
}

tasks.matching { it.name == 'runSmokeClient' }.configureEach {
    def marker = file('run/task0-smoke/task0-pass.txt')
    doFirst { marker.delete() }
    doLast {
        if (!marker.isFile()) throw new GradleException('Task 0 smoke did not reach PASS; inspect run/task0-smoke/logs/latest.log')
    }
}

tasks.matching { it.name == 'runReproductionClient' }.configureEach {
    def marker = file('run/task1a/task1a-pass.txt')
    doFirst { marker.delete() }
    doLast {
        if (!marker.isFile()) throw new GradleException('Task 1A reproduction harness did not finish; inspect run/task1a/logs/latest.log')
    }
}
