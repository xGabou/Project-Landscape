import groovy.json.JsonOutput

plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.42'
    id 'org.spongepowered.mixin' version '0.7.38'
    id 'com.hypherionmc.modutils.modpublisher' version '2.2.1' // CurseForge uploader
    id "com.modrinth.minotaur" version "2.8.10" // Modrinth uploader
}

group = maven_group
version = mod_version
base { archivesName = "${mod_id}-forge-${minecraft_version}" }
java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

// Development-only smoke harness. Never packaged in the production mod jar.
sourceSets {
    reproduction {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    smoke {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { projectlandscape { source sourceSets.main } }
        }
        client { }
        reproductionClient {
            parent runs.client
            workingDirectory project.file('run/task1a')
            mods { task1a_reproduction { source sourceSets.reproduction } }
            jvmArgs '-Xmx6G'
            if (providers.gradleProperty('reproProcessors').isPresent()) {
                jvmArgs "-XX:ActiveProcessorCount=${providers.gradleProperty('reproProcessors').get()}"
            }
            property 'task1a.profile', providers.gradleProperty('reproProfile').getOrElse('full')
            property 'task1a.seeds', providers.gradleProperty('reproSeeds').getOrElse('8675309,4303642605,42,-987654321')
            property 'task1a.repeats', providers.gradleProperty('reproRepeats').getOrElse('3')
            property 'task1a.points', providers.gradleProperty('reproPoints').getOrElse('')
            property 'phase2a.runtime', providers.gradleProperty('phase2aRuntime').getOrElse('false')
            // Task 1C test corpus only; no production generation-version mechanism.
            property 'task1c.fixtureFile', file('docs/task1c/evidence/fixture_manifest.json').absolutePath
            if (providers.gradleProperty('reproPreset').isPresent()) {
                property 'task1a.presetFile', file(providers.gradleProperty('reproPreset').get()).absolutePath
            }
            args '--mixin.config', 'task1a-observers.mixins.json'
        }
        smokeClient {
            parent runs.client
            workingDirectory project.file('run/task0-smoke')
            mods { baseline_smoke { source sourceSets.smoke } }
            property 'mixin.debug.export', 'true'
            property 'task1b.smokeVanilla', providers.gradleProperty('smokeVanilla').getOrElse('false')
            property 'task1b.exportLegacyPreset', providers.gradleProperty('smokeLegacyExport').getOrElse('false')
            if (providers.gradleProperty('smokeExistingWorld').isPresent()) {
                property 'task2.existingWorld', providers.gradleProperty('smokeExistingWorld').get()
            }
            jvmArgs '-Xmx6G'
        }
        server { args '--nogui' }
        data {
            workingDirectory project.file('run/data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'),
                 '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, 'reterraforged-refmap.json'
    config 'reterraforged-common.mixins.json'
    config 'reterraforged-forge.mixins.json'
}
sourceSets.main.resources.srcDir 'src/generated/resources'

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly fg.deobf("curse.maven:terrablender-563928:${terrablender_curse_file}")
    if (providers.gradleProperty('withTerraBlender').get().toBoolean()) {
        runtimeOnly fg.deobf("curse.maven:terrablender-563928:${terrablender_curse_file}")
    }
    if (providers.gradleProperty('withDevelopmentMods').get().toBoolean()) {
        runtimeOnly fg.deobf('curse.maven:project-atmosphere-1258344:8851671')
        runtimeOnly fg.deobf('curse.maven:gabous-libs-1367332:8774253')
        runtimeOnly fg.deobf('curse.maven:glitchcore-955399:5787839')
        runtimeOnly fg.deobf('curse.maven:serene-seasons-291874:8246702')
        runtimeOnly fg.deobf('curse.maven:simple-clouds-1121215:6928978')
        runtimeOnly fg.deobf('curse.maven:architectury-api-419699:5137938')
    }
}
tasks.register("runClientWithMods", Exec) {
    group = "forgegradle runs"
    description = "Runs the Minecraft client with development mods and TerraBlender"

    def isWindows = System.getProperty("os.name").toLowerCase().contains("windows")

    if (isWindows) {
        commandLine "cmd", "/c", "gradlew.bat",
                "runClient",
                "-PwithDevelopmentMods=true",
                "-PwithTerraBlender=true"
    } else {
        commandLine "./gradlew",
                "runClient",
                "-PwithDevelopmentMods=true",
                "-PwithTerraBlender=true"
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.named('jar', Jar) {
    from('LICENSE') { into 'META-INF' }
    manifest {
        attributes 'MixinConfigs': 'reterraforged-common.mixins.json,reterraforged-forge.mixins.json'
    }
    finalizedBy 'reobfJar'
}
tasks.named('sourcesJar', Jar) { from('LICENSE') { into 'META-INF' } }

tasks.matching { it.name == 'runSmokeClient' }.configureEach {
    def marker = file('run/task0-smoke/task0-pass.txt')
    doFirst { marker.delete() }
    doLast {
        if (!marker.isFile()) throw new GradleException('Task 0 smoke did not reach PASS; inspect run/task0-smoke/logs/latest.log')
    }
}

tasks.matching { it.name == 'runReproductionClient' }.configureEach {
    def marker = file('run/task1a/task1a-pass.txt')
    doFirst { marker.delete() }
    doLast {
        if (!marker.isFile()) throw new GradleException('Task 1A reproduction harness did not finish; inspect run/task1a/logs/latest.log')
    }
}

tasks.register('phase2aHistoryChecks', JavaExec) {
    dependsOn tasks.named('performanceClasses')
    classpath = sourceSets.performance.runtimeClasspath
    mainClass = 'baseline.reproduction.performance.RuntimeHistoryChecks'
    args file('build/phase2a-history/history.dat').absolutePath
}
tasks.register("discordWebhook") {
    doLast {
        def webhookUrl = System.getenv("DISCORD_WEBHOOK_URL")?.trim()
        if (!webhookUrl) {
            println "Skipping Discord webhook notification: DISCORD_WEBHOOK_URL not set."
            return
        }

        def changelogText = rootProject.file("PLChangelog.md").text

        def payload = [
                username        : "Build Bot",
                allowed_mentions: [parse: ["roles"]],
                content         : "**New release published!** 🎉\n" +
                        "<@&1537735740367183892>\n" + // role mention
                        "Project: ${mod_name}\n" +
                        "Version: v${project.mod_version}-1.20.1\n\n" +
                        "${changelogText.take(1891)}"
        ]

        println "Sending release notification to Discord..."
        def connection = new URL(webhookUrl).openConnection()
        connection.with {
            doOutput = true
            requestMethod = "POST"
            setRequestProperty("Content-Type", "application/json")
            outputStream.withWriter("UTF-8") { it << JsonOutput.toJson(payload) }
            println "Webhook sent with response code: ${responseCode}"
        }
    }
}
def releaseJarFile = layout.buildDirectory.file("libs/${base.archivesName.get()}-${project.version}.jar")
modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = "Xuhmo3Js" // from your Modrinth project URL
    versionNumber = "Forge-${project.version}"
    versionName = "Project Landscape ${mod_version}"
    changelog = rootProject.file("PLChangelog.md").text
    gameVersions = ["1.20.1"]
    loaders = ["forge"]
    versionType = "alpha"
    dependencies {
        optional.project "qIWoLcKJ" //TODO change after 0.2
        required.project "N8aGZtvj"
        optional.project "vdjF5PL5" //TODO change after 0.2
    }
    uploadFile = releaseJarFile.get().asFile
}
def curseForgeToken = System.getenv("CURSEFORGE_TOKEN")?.trim()
def hasCurseForgeToken = curseForgeToken != null && !curseForgeToken.isEmpty()
if (hasCurseForgeToken) {
    publisher {
        apiKeys {
            curseforge curseForgeToken
        }
        setCurseID("1687466")
        setVersionType("alpha")
        setChangelog(rootProject.file("PLChangelog.md"))
        setDisplayName("Forge-${project.version}")
        setGameVersions("1.20.1")
        setLoaders("forge")
        setCurseEnvironment("both")
        getJavaVersions().set([JavaVersion.VERSION_17])
        setArtifact(tasks.named("jar"))
        setDebug(providers.gradleProperty("publisherDebug").map { it.toBoolean() }.orElse(false).get())
        curseDepends {
            optional "project-atmosphere"       // Moonlight Lib
            required "gabous-libs"  // Gabou's Libs
            optional "dynamictrees" // Dynamic Trees
        }
    }
} else {
    logger.lifecycle("CURSEFORGE_TOKEN not set; CurseForge upload tasks will be disabled.")
    tasks.named("publishCurseforge").configure { enabled = false }
}

tasks.named("publishCurseforge").configure {
    dependsOn("build")
}

tasks.register("curseforge1504017") {
    group = "publishing"
    description = "Publishes the Forge release to CurseForge project 1504017."
    dependsOn("publishCurseforge")
    enabled = hasCurseForgeToken
}
